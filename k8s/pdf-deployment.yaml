apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pdf-storage-pvc
  namespace: localrag
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pdf-microservice
  namespace: localrag
  labels:
    app: pdf-microservice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pdf-microservice
  template:
    metadata:
      labels:
        app: pdf-microservice
    spec:
      containers:
        - name: pdf-microservice
          image: localrag/pdf-microservice:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8001
              name: http
          env:
            - name: PORT
              value: "8001"
            - name: STORAGE_PATH
              value: "/data/documents"
            - name: RAG_SERVICE_URL
              value: "http://rag-service:8002"
          volumeMounts:
            - name: pdf-storage
              mountPath: /data/documents
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/live
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
      volumes:
        - name: pdf-storage
          persistentVolumeClaim:
            claimName: pdf-storage-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: pdf-service
  namespace: localrag
  labels:
    app: pdf-microservice
spec:
  type: ClusterIP
  ports:
    - port: 8001
      targetPort: 8001
      protocol: TCP
      name: http
  selector:
    app: pdf-microservice
