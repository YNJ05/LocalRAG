apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: localrag
  namespace: argocd
  labels:
    app.kubernetes.io/name: localrag
    app.kubernetes.io/part-of: localrag-platform
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/YNJ05/LocalRAG.git
    targetRevision: HEAD
    path: helm/localrag
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: localrag
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
