{{- if .Values.ollama.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "localrag.fullname" . }}-ollama-pvc
  labels:
    {{- include "localrag.labels" . | nindent 4 }}
    app.kubernetes.io/component: ollama
spec:
  accessModes:
    {{- toYaml .Values.ollama.persistence.accessModes | nindent 4 }}
  {{- if .Values.global.storageClass }}
  storageClassName: {{ .Values.global.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.ollama.persistence.size }}
---
{{- end }}
