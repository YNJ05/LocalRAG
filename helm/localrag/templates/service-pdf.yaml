apiVersion: v1
kind: Service
metadata:
  name: {{ include "localrag.fullname" . }}-pdf-service
  labels:
    {{- include "localrag.labels" . | nindent 4 }}
    app.kubernetes.io/component: pdf-microservice
spec:
  type: {{ .Values.pdfMicroservice.service.type }}
  ports:
    - port: {{ .Values.pdfMicroservice.service.port }}
      targetPort: {{ .Values.pdfMicroservice.service.port }}
      protocol: TCP
      name: http
  selector:
    {{- include "localrag.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: pdf-microservice
