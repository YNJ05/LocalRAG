{{- if .Values.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "localrag.fullname" . }}-ingress
  labels:
    {{- include "localrag.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- toYaml .Values.ingress.tls | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /api/v1/documents
            pathType: Prefix
            backend:
              service:
                name: {{ include "localrag.fullname" . }}-pdf-service
                port:
                  number: {{ .Values.pdfMicroservice.service.port }}
          - path: /api/v1/rag
            pathType: Prefix
            backend:
              service:
                name: {{ include "localrag.fullname" . }}-rag-service
                port:
                  number: {{ .Values.ragMicroservice.service.port }}
          - path: /api/v1/chat
            pathType: Prefix
            backend:
              service:
                name: {{ include "localrag.fullname" . }}-chat-service
                port:
                  number: {{ .Values.chatMicroservice.service.port }}
          - path: /api/v1/session
            pathType: Prefix
            backend:
              service:
                name: {{ include "localrag.fullname" . }}-chat-service
                port:
                  number: {{ .Values.chatMicroservice.service.port }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "localrag.fullname" . }}-ui-service
                port:
                  number: {{ .Values.frontend.service.port }}
{{- end }}
