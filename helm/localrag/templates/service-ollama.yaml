{{- if .Values.ollama.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "localrag.fullname" . }}-ollama-service
  labels:
    {{- include "localrag.labels" . | nindent 4 }}
    app.kubernetes.io/component: ollama
spec:
  type: {{ .Values.ollama.service.type }}
  ports:
    - port: {{ .Values.ollama.service.port }}
      targetPort: {{ .Values.ollama.service.port }}
      protocol: TCP
      name: http
  selector:
    {{- include "localrag.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: ollama
{{- end }}
