apiVersion: v1
kind: Service
metadata:
  name: {{ include "localrag.fullname" . }}-ui-service
  labels:
    {{- include "localrag.labels" . | nindent 4 }}
    app.kubernetes.io/component: ui-frontend
spec:
  type: {{ .Values.frontend.service.type }}
  ports:
    - port: {{ .Values.frontend.service.port }}
      targetPort: {{ .Values.frontend.service.port }}
      {{- if and (eq .Values.frontend.service.type "NodePort") .Values.frontend.service.nodePort }}
      nodePort: {{ .Values.frontend.service.nodePort }}
      {{- end }}
      protocol: TCP
      name: http
  selector:
    {{- include "localrag.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: ui-frontend
