name: localrag

services:
  api:
    build: ./apps/api
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    env_file: [ { path: .env, required: false } ]
    environment:
      QDRANT_URL: http://localhost:6333
      OLLAMA_URL: http://localhost:11434
      STORAGE_PATH: /data/documents
    volumes: [ documents:/data/documents ]
    network_mode: "host"
    depends_on: [ qdrant ]

  web:
    build: ./apps/web
    environment: { NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1 }
    ports: [ "8080:3000" ]
    depends_on: [ api ]

  qdrant:
    image: qdrant/qdrant:v1.12.5
    ports: [ "6333:6333" ]
    volumes: [ qdrant:/qdrant/storage ]

  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: [ observability ]
    volumes: [ "./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro" ]
    networks: [ default ]

  grafana:
    image: grafana/grafana:11.3.0
    profiles: [ observability ]
    ports: [ "3001:3000" ]
    volumes: [ "./infra/grafana:/etc/grafana/provisioning:ro" ]
    depends_on: [ prometheus ]
    networks: [ default ]

volumes:
  documents:
  qdrant:
